# JUnit 5 Execution Configuration
# Sequential execution by default for visual (non-headless) stability.
# To enable parallel execution, run in headless mode: mvn test -Dheadless=true -Djunit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.enabled = false
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
